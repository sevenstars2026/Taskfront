[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-task-compiler"
version = "0.1.0"
description = "Compile ambiguous natural-language requests into validated, dispatch-ready agent intents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "TaskFront contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "coverage>=7,<8"]

[project.scripts]
taskc = "taskc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taskc"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
