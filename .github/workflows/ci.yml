name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Validate contracts
        run: python -m taskc.cli contract validate examples/evaluation/contracts

      - name: Evaluate 60 labeled scenarios
        run: python -m taskc.cli eval run examples/evaluation/scenarios-v0.2.json --contracts examples/evaluation/contracts --json

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
